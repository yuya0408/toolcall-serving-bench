name: Deploy smoke-test

on:
  push:
    branches: [main]
    paths:
      - "infra/smoke-test/**"
      - ".github/workflows/deploy-smoke-test.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: smoke-test
  ECS_SERVICE: smoke-test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::344261432226:role/github-actions-tool-call-bench
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:latest" -f infra/smoke-test/Dockerfile infra/smoke-test
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Force new ECS deployment
        run: |
          # aws_ecs_express_gateway_service doesn't expose a fixed cluster
          # name in Terraform, so the cluster is discovered at runtime by
          # scanning for the one that owns the smoke-test service.
          cluster=""
          for c in $(aws ecs list-clusters --query 'clusterArns[]' --output text); do
            if aws ecs list-services --cluster "$c" --query 'serviceArns[]' --output text | grep -q "$ECS_SERVICE"; then
              cluster="$c"
              break
            fi
          done

          if [ -z "$cluster" ]; then
            echo "::error::Could not find an ECS cluster running the $ECS_SERVICE service"
            exit 1
          fi

          aws ecs update-service \
            --cluster "$cluster" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
