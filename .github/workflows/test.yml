name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is what the GPU runs used (scripts/gpu/setup.sh); 3.13 checks a newer one
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # torch/transformers/requests are imported lazily inside the adapters;
      # numpy/scipy are for the simulation and cross-check tests only.
      - run: pip install -r requirements-dev.txt

      # rules are in pyproject.toml [tool.ruff.lint]
      - run: ruff check .

      # pyproject.toml puts the repo root and scripts/ on the test path.
      - run: python -m pytest -q
