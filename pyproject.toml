[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-serving-bench"
version = "0.1.0"
description = "Tool-calling accuracy and latency of LLM serving engines on one L4 GPU, judged by non-inferiority margins fixed before the runs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# requirements.txt stays the one list: scripts/gpu/setup.sh installs it on the GPU instance
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["eval_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the command-line scripts are imported by name in the tests
pythonpath = [".", "scripts", "scripts/gpu"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# pyflakes (F) catches undefined names and leftovers; E4/E7/E9 are the import and
# statement checks; RUF100 fails on a `# noqa` that no longer suppresses anything
select = ["E4", "E7", "E9", "F", "RUF100"]
